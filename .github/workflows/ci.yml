name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: godforge
          POSTGRES_PASSWORD: godforge_local_password
          POSTGRES_DB: godforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godforge -d godforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GODFORGE_TEST_POSTGRES: Host=localhost;Port=5432;Database=godforge_test;Username=godforge;Password=godforge_local_password
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: GodForge-BE/global.json
      - name: Restore dependencies
        working-directory: GodForge-BE
        run: dotnet restore
      - name: Build
        working-directory: GodForge-BE
        run: dotnet build --no-restore
      - name: Test
        working-directory: GodForge-BE
        run: dotnet test --no-build --collect:"XPlat Code Coverage"
      - name: Format check
        working-directory: GodForge-BE
        run: dotnet format --verify-no-changes
      - name: Vulnerability check
        working-directory: GodForge-BE
        run: dotnet list package --vulnerable --include-transitive

  frontend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: GodForge-FE
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: GodForge-FE
        run: npm run lint
      - name: Typecheck
        working-directory: GodForge-FE
        run: npm run typecheck
      - name: Test
        working-directory: GodForge-FE
        run: npm run test:unit
      - name: Build
        working-directory: GodForge-FE
        run: npm run build
      - name: Audit critical vulnerabilities
        working-directory: GodForge-FE
        run: npm audit --audit-level=critical