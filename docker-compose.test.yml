name: godforge-verification

# Disposable local test infrastructure, isolated from development databases.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: godforge
      POSTGRES_PASSWORD: godforge_verification_only
      POSTGRES_DB: godforge_test
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godforge -d godforge_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
