# Add to docker-compose.backend.yml for an isolated M2 development provider.
# Pinned Forgejo 15 LTS; isolated acceptance uses docker-compose.m2-test.yml.
services:
  api:
    environment:
      Forgejo__Enabled: ${Forgejo__Enabled:-false}
      Forgejo__BaseUrl: http://forgejo:3000
      Forgejo__PublicUrl: http://localhost:13000
      Forgejo__AllowLocalHttp: "true"
      Forgejo__ApiToken: ${Forgejo__ApiToken:-}
      Forgejo__WebhookSecret: ${Forgejo__WebhookSecret:-}
      Forgejo__WebhookUrl: http://api:8080/api/v1/webhooks/forgejo
  worker:
    environment:
      Forgejo__Enabled: ${Forgejo__Enabled:-false}
      Forgejo__BaseUrl: http://forgejo:3000
      Forgejo__PublicUrl: http://localhost:13000
      Forgejo__AllowLocalHttp: "true"
      Forgejo__ApiToken: ${Forgejo__ApiToken:-}
      Forgejo__WebhookSecret: ${Forgejo__WebhookSecret:-}
      Forgejo__WebhookUrl: http://api:8080/api/v1/webhooks/forgejo
  forgejo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD:?Supply an ignored local Forgejo database password}
    volumes: ["m2-forgejo-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 3s
      timeout: 5s
      retries: 30
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
    depends_on:
      forgejo-db: { condition: service_healthy }
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__ROOT_URL: http://localhost:13000/
      FORGEJO__server__SSH_PORT: "12222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: api
    ports: ["127.0.0.1:13000:3000", "127.0.0.1:12222:2222"]
    volumes: ["m2-forgejo-data:/var/lib/gitea", "m2-forgejo-config:/etc/gitea"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  m2-forgejo-db:
  m2-forgejo-data:
  m2-forgejo-config:
